<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVERGARDEN STORE — Catálogo Exclusivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marfil: '#FAF8F5',
            superficie: '#FFFFFF',
            borde: '#EAE4DA',
            grafito: '#242220',
            suave: '#6E6962',
            champagne: '#C8A96E',
            champagneOscuro: '#A6874E',
            rojoOtono: '#8E3B3B',
            marronMK: '#6D4C3D'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #FAF8F5;
      color: #242220;
      line-height: 1.35;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .card-producto {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-producto:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -12px rgba(36, 34, 32, 0.14);
    }
  </style>
</head>
<body class="antialiased selection:bg-champagne/25 selection:text-grafito">

  <!-- Encabezado compacto -->
  <header class="sticky top-0 z-30 bg-marfil/95 backdrop-blur-sm border-b border-borde">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <div class="flex items-baseline gap-3">
        <a href="#" class="font-serif text-2xl sm:text-3xl font-semibold tracking-wider text-champagne">
          EVERGARDEN STORE
        </a>
        <span class="text-[11px] uppercase tracking-widest text-suave hidden md:inline">
          Importaciones &amp; E-commerce
        </span>
      </div>

      <!-- Barra sutil de paleta de referencia -->
      <div class="flex items-center gap-2 text-[11px] text-suave" title="Paleta de la boutique">
        <span class="hidden sm:inline">Paleta:</span>
        <span class="w-3 h-3 rounded-full border border-borde bg-[#FAF8F5]" title="Marfil"></span>
        <span class="w-3 h-3 rounded-full border border-borde bg-[#242220]" title="Grafito"></span>
        <span class="w-3 h-3 rounded-full border border-borde bg-[#C8A96E]" title="Champagne"></span>
        <span class="w-3 h-3 rounded-full border border-borde bg-[#8E3B3B]" title="Rojo Otoño"></span>
        <span class="w-3 h-3 rounded-full border border-borde bg-[#6D4C3D]" title="Marrón"></span>
      </div>
    </div>
  </header>

  <!-- Presentación compacta -->
  <section class="max-w-6xl mx-auto px-4 pt-6 pb-4 border-b border-borde/70">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-3">
      <div>
        <p class="text-[11px] uppercase tracking-[0.18em] text-champagneOscuro font-medium leading-tight">
          Stock inmediato y preventa
        </p>
        <h1 class="font-serif text-2xl sm:text-3xl font-semibold text-grafito leading-tight mt-0.5">
          Catálogo de Carteras y Billeteras
        </h1>
      </div>
      <p class="text-xs text-suave max-w-md leading-snug">
        Piezas originales de Tommy Hilfiger y Michael Kors. Consultas y reservas directas por WhatsApp.
      </p>
    </div>

    <!-- Filtros -->
    <div class="mt-4 flex flex-wrap items-center justify-between gap-2">
      <div id="filtros-marca" class="flex flex-wrap gap-1.5">
        <button data-marca="ALL" class="filtro-btn px-3 py-1 text-xs rounded-full bg-grafito text-marfil font-medium leading-none">
          Todos
        </button>
        <button data-marca="Tommy Hilfiger" class="filtro-btn px-3 py-1 text-xs rounded-full border border-borde bg-superficie text-grafito hover:border-champagne leading-none">
          Tommy Hilfiger
        </button>
        <button data-marca="Michael Kors" class="filtro-btn px-3 py-1 text-xs rounded-full border border-borde bg-superficie text-grafito hover:border-champagne leading-none">
          Michael Kors
        </button>
      </div>

      <div id="filtros-estado" class="flex flex-wrap gap-1.5">
        <button data-estado="ALL" class="estado-btn px-2.5 py-1 text-xs rounded-full bg-champagne/20 text-grafito font-medium leading-none">
          Todo estado
        </button>
        <button data-estado="Stock" class="estado-btn px-2.5 py-1 text-xs rounded-full border border-borde bg-superficie text-suave hover:text-grafito leading-none">
          Stock
        </button>
        <button data-estado="Preventa" class="estado-btn px-2.5 py-1 text-xs rounded-full border border-borde bg-superficie text-suave hover:text-grafito leading-none">
          Preventa
        </button>
      </div>
    </div>
  </section>

  <!-- Cuadrícula de productos -->
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div id="catalogo-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <!-- Pie de página compacto -->
  <footer class="border-t border-borde bg-superficie/70 mt-6">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-suave">
      <span class="font-serif text-base font-semibold text-champagne">EVERGARDEN STORE</span>
      <span class="leading-tight">WhatsApp directo: +51 928 439 121</span>
    </div>
  </footer>

  <script>
    const WHATSAPP_NUMBER = '51928439121';

    const productos = [
      {
        id: 'th-cartera-negra-stock',
        marca: 'Tommy Hilfiger',
        nombre: 'Cartera Tommy Hilfiger color negro',
        estado: 'Stock',
        precio: 'S/ 359.00',
        composicion: 'Cuero sintético de alta calidad - Poliuretano',
        imagenes: ['imagenes/th_cdn_broche_1.jpeg']
      },
      {
        id: 'th-billetera-broche',
        marca: 'Tommy Hilfiger',
        nombre: 'Billetera broche Tommy Hilfiger',
        estado: 'Stock',
        precio: 'S/ 219.00',
        composicion: 'Material sintético de alta calidad - Poliuretano',
        imagenes: ['imagenes/th_broche_01.jpg']
      },
      {
        id: 'th-billetera-cierre',
        marca: 'Tommy Hilfiger',
        nombre: 'Billetera cierre Tommy Hilfiger',
        estado: 'Stock',
        precio: 'S/ 199.00',
        composicion: 'Material sintético de alta calidad - Poliuretano',
        imagenes: ['imagenes/th_cierre_01.jpg']
      },
      {
        id: 'th-cartera-negra',
        marca: 'Tommy Hilfiger',
        nombre: 'Cartera negra Tommy Hilfiger',
        estado: 'Stock',
        precio: 'S/ 359.00',
        composicion: 'Cuero sintético de alta calidad - Poliuretano',
        imagenes: ['imagenes/th_cartera_01.jpg']
      },
      {
        id: 'th-billetera-tres-cuerpos-negro',
        marca: 'Tommy Hilfiger',
        nombre: 'Billetera Tommy Hilfiger tres cuerpos color negro',
        estado: 'Preventa',
        precio: 'S/ 219.00',
        composicion: 'Cuero sintético de alta calidad (Poliuretano)',
        imagenes: [
          'imagenes/pth_bdn_hevilla_01.jpg',
          'imagenes/pth_bdn_hevilla_02.jpg',
          'imagenes/pth_bdn_hevilla_03.jpg'
        ]
      },
      {
        id: 'th-billetera-rojo-otono',
        marca: 'Tommy Hilfiger',
        nombre: 'Billetera Tommy Hilfiger 100% cuero color rojo otoño',
        estado: 'Preventa',
        precio: 'S/ 249.00',
        composicion: '100% cuero',
        imagenes: [
          'imagenes/pth_bdro_cuero_01.jpg',
          'imagenes/pth_bdro_cuero_02.jpg',
          'imagenes/pth_bdro_cuero_03.jpg'
        ]
      },
      {
        id: 'th-micro-tote-rojo-otono',
        marca: 'Tommy Hilfiger',
        nombre: 'Micro tote bag Tommy Hilfiger color rojo otoño',
        estado: 'Preventa',
        precio: 'S/ 299.00',
        composicion: 'Poliuretano',
        imagenes: [
          'imagenes/pth_cdg_01.jpg',
          'imagenes/pth_cdg_02.jpg',
          'imagenes/pth_cdg_03.jpg'
        ]
      },
      {
        id: 'mk-billetera-marron',
        marca: 'Michael Kors',
        nombre: 'Billetera marrón Michael Kors',
        estado: 'Stock',
        precio: 'S/ 299.00',
        composicion: 'Material sintético de alta calidad',
        imagenes: ['imagenes/mk_billetera_marron_01.jpg']
      },
      {
        id: 'mk-cartera-marron',
        marca: 'Michael Kors',
        nombre: 'Cartera marrón Michael Kors',
        estado: 'Stock',
        precio: 'S/ 499.00',
        composicion: 'Material sintético de alta calidad',
        imagenes: ['imagenes/mk_cartera_marron_01.jpg']
      },
      {
        id: 'mk-billetera-negra',
        marca: 'Michael Kors',
        nombre: 'Billetera negra Michael Kors',
        estado: 'Stock',
        precio: 'S/ 359.00',
        composicion: 'Material sintético de alta calidad',
        imagenes: ['imagenes/mk_billetera_negra_01.jpg']
      }
    ];

    let filtroMarca = 'ALL';
    let filtroEstado = 'ALL';

    function cambiarFoto(prodIndex, imgSrc, btnEl) {
      const mainImg = document.getElementById(`img-principal-${prodIndex}`);
      if (mainImg) mainImg.src = imgSrc;

      const card = document.getElementById(`card-${prodIndex}`);
      if (card) {
        card.querySelectorAll('.thumb-btn').forEach(b => {
          b.classList.remove('border-champagneOscuro');
          b.classList.add('border-borde');
        });
      }
      if (btnEl) {
        btnEl.classList.remove('border-borde');
        btnEl.classList.add('border-champagneOscuro');
      }
    }

    function renderCatalogo() {
      const grid = document.getElementById('catalogo-grid');
      const filtrados = productos.filter(p => {
        const okMarca = filtroMarca === 'ALL' || p.marca === filtroMarca;
        const okEstado = filtroEstado === 'ALL' || p.estado === filtroEstado;
        return okMarca && okEstado;
      });

      if (filtrados.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-10 text-sm text-suave bg-superficie rounded-xl border border-borde">
            No hay productos con ese filtro en este momento.
          </div>`;
        return;
      }

      grid.innerHTML = filtrados.map((p, idx) => {
        const esPreventa = p.estado === 'Preventa';
        const badgeClass = esPreventa
          ? 'bg-rojoOtono/10 text-rojoOtono border-rojoOtono/25'
          : 'bg-champagne/15 text-champagneOscuro border-champagne/30';

        const mensajeWa = encodeURIComponent(
          `Hola EVERGARDEN STORE, me interesa: ${p.nombre} (${p.estado}) - ${p.precio}`
        );
        const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${mensajeWa}`;

        const miniaturasHtml = p.imagenes.length > 1
          ? `<div class="flex gap-1.5 mt-2">
              ${p.imagenes.map((img, i) => `
                <button type="button"
                  onclick="cambiarFoto(${idx}, '${img}', this)"
                  class="thumb-btn w-10 h-10 rounded border overflow-hidden bg-marfil ${i === 0 ? 'border-champagneOscuro' : 'border-borde'}">
                  <img src="${img}" alt="${p.nombre} vista ${i + 1}" class="w-full h-full object-cover" onerror="this.style.opacity='0.35'" />
                </button>
              `).join('')}
            </div>`
          : '';

        return `
          <article id="card-${idx}" class="card-producto bg-superficie rounded-xl border border-borde p-3.5 flex flex-col justify-between">
            <div>
              <div class="relative aspect-[4/3] w-full rounded-lg bg-marfil border border-borde/70 overflow-hidden flex items-center justify-center">
                <img id="img-principal-${idx}"
                  src="${p.imagenes[0]}"
                  alt="${p.nombre}"
                  class="w-full h-full object-contain p-2"
                  onerror="this.alt='Imagen pendiente en carpeta imagenes/'" />
                <span class="absolute top-2 left-2 text-[10px] font-medium uppercase tracking-wider px-2 py-0.5 rounded-full border ${badgeClass}">
                  ${p.estado}
                </span>
              </div>

              ${miniaturasHtml}

              <div class="mt-3">
                <p class="text-[10px] uppercase tracking-wider text-suave font-medium leading-tight">${p.marca}</p>
                <h2 class="font-serif text-lg font-semibold text-grafito leading-snug mt-0.5">${p.nombre}</h2>
                <p class="text-[11px] text-suave leading-snug mt-1">
                  <span class="font-medium text-grafito/80">Composición:</span> ${p.composicion}
                </p>
              </div>
            </div>

            <div class="mt-3.5 pt-2.5 border-t border-borde/70 flex items-center justify-between gap-2">
              <span class="text-base font-semibold text-grafito">${p.precio}</span>
              <a href="${waUrl}" target="_blank" rel="noopener noreferrer"
                class="px-3 py-1.5 rounded-lg bg-grafito hover:bg-champagneOscuro text-marfil text-xs font-medium transition-colors leading-none">
                Consultar WhatsApp
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    document.querySelectorAll('.filtro-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filtroMarca = btn.dataset.marca;
        document.querySelectorAll('.filtro-btn').forEach(b => {
          b.className = 'filtro-btn px-3 py-1 text-xs rounded-full border border-borde bg-superficie text-grafito hover:border-champagne leading-none';
        });
        btn.className = 'filtro-btn px-3 py-1 text-xs rounded-full bg-grafito text-marfil font-medium leading-none';
        renderCatalogo();
      });
    });

    document.querySelectorAll('.estado-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filtroEstado = btn.dataset.estado;
        document.querySelectorAll('.estado-btn').forEach(b => {
          b.className = 'estado-btn px-2.5 py-1 text-xs rounded-full border border-borde bg-superficie text-suave hover:text-grafito leading-none';
        });
        btn.className = 'estado-btn px-2.5 py-1 text-xs rounded-full bg-champagne/20 text-grafito font-medium leading-none';
        renderCatalogo();
      });
    });

    renderCatalogo();
  </script>
</body>
</html>
